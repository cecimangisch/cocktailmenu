<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1600" role="img" aria-labelledby="title desc">
  <title id="title">Carta de ejemplo</title>
  <desc id="desc">Ilustración decorativa con tres tragos y texto de muestra.</desc>
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#2c2019"/>
      <stop offset="1" stop-color="#100d0b"/>
    </linearGradient>
    <linearGradient id="copa" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#efb55f"/>
      <stop offset="1" stop-color="#b74b2f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1600" fill="url(#fondo)"/>
  <circle cx="1040" cy="160" r="330" fill="#aa663c" opacity=".1"/>
  <circle cx="80" cy="1450" r="300" fill="#d9ad73" opacity=".07"/>
  <g fill="none" stroke="#d9ad73" stroke-width="5" opacity=".9">
    <path d="M280 430h250l-55 230c-15 65-55 105-70 112v250"/>
    <path d="M405 1022h-105 210"/>
    <path d="M670 510h260l-35 340H705z"/>
    <path d="M690 675h225"/>
  </g>
  <path d="M300 520h210l-37 137c-18 63-48 80-68 94-20-14-50-31-68-94z" fill="url(#copa)" opacity=".92"/>
  <path d="M700 690h215l-17 150H717z" fill="#b45230" opacity=".9"/>
  <circle cx="815" cy="590" r="70" fill="#e7b85c" opacity=".9"/>
  <circle cx="815" cy="590" r="48" fill="#2c2019"/>
  <g text-anchor="middle" fill="#f5e3ca">
    <text x="600" y="180" font-family="Arial, sans-serif" font-size="24" letter-spacing="10">CARTA DE EJEMPLO</text>
    <text x="600" y="285" font-family="Georgia, serif" font-size="78">Tus tragos van aquí</text>
    <text x="600" y="1240" font-family="Georgia, serif" font-size="42">Reemplazá esta imagen</text>
    <text x="600" y="1300" font-family="Arial, sans-serif" font-size="24" fill="#bfa98d">por la foto de tu carta</text>
  </g>
